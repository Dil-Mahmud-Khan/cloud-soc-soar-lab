detect:
  event: NEW_PROCESS
  op: and
  rules:
    - op: ends with
      path: event/FILE_PATH
      value: powershell.exe
    - op: or
      rules:
        - op: contains
          path: event/COMMAND_LINE
          value: -EncodedCommand
        - op: contains
          path: event/COMMAND_LINE
          value: -enc
        - op: contains
          path: event/COMMAND_LINE
          value: -ExecutionPolicy Bypass

respond:
  - action: report
    name: "T1059.001 - Obfuscated PowerShell Command Execution"
    publish: true
