title: Potential LSASS Memory Dump via Comsvcs.dll and Rundll32
id: 8d42918e-4a77-4402-9901-b51079d39102
status: test
description: Detects the execution of rundll32.exe calling comsvcs.dll with the MiniDump export function to dump LSASS process memory.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://modexp.wordpress.com/2019/08/30/minidumpwritedump-via-comsvcs-dll/
author: Dil Mahmud Khan
date: 2026-09-22
tags:
  - attack.t1003.001
  - attack.credential_access
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\rundll32.exe'
    - OriginalFileName: 'RUNDLL32.EXE'
  selection_dll:
    CommandLine|contains: 'comsvcs'
  selection_function:
    CommandLine|contains:
      - 'MiniDump'
      - '#24'
  condition: selection_img and selection_dll and selection_function
falsepositives:
  - Legitimate crash dump generation by diagnostic software (rarely targets lsass)
level: critical
